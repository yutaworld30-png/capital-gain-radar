name: Update data and deploy private Cloudflare Pages

on:
  workflow_dispatch:
  schedule:
    # 16:10 JST on weekdays. Scheduled runs stay disabled until setup is complete.
    - cron: "10 7 * * 1-5"
    # 19:10 JST backup. It skips when the authenticated site is already fresh.
    - cron: "10 10 * * 1-5"

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-private-pages
  cancel-in-progress: false

jobs:
  freshness:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_PRIVATE_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_refresh: ${{ steps.decision.outputs.should_refresh }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check private deployment configuration
        env:
          PRIVATE_DEPLOYMENT_ENABLED: ${{ vars.CLOUDFLARE_PRIVATE_DEPLOYMENT_ENABLED }}
          PRIVATE_SITE_URL: ${{ vars.CLOUDFLARE_PRIVATE_SITE_URL }}
          PRIVATE_HISTORY_SOURCE_URL: ${{ vars.PRIVATE_HISTORY_SOURCE_URL }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          NIKKEI_PRIVATE_CLOUD_USE_CONFIRMED: ${{ vars.NIKKEI_PRIVATE_CLOUD_USE_CONFIRMED }}
          JPX_PRIVATE_CLOUD_USE_CONFIRMED: ${{ vars.JPX_PRIVATE_CLOUD_USE_CONFIRMED }}
          PRIVATE_SERVICE_TOKEN: ${{ secrets.PRIVATE_SERVICE_TOKEN }}
        run: |
          test "$PRIVATE_DEPLOYMENT_ENABLED" = "true" || { echo "Private deployment is not enabled."; exit 1; }
          test -n "$PRIVATE_SITE_URL" || { echo "CLOUDFLARE_PRIVATE_SITE_URL is required."; exit 1; }
          test -n "$PRIVATE_HISTORY_SOURCE_URL" || { echo "PRIVATE_HISTORY_SOURCE_URL is required."; exit 1; }
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "CLOUDFLARE_PAGES_PROJECT is required."; exit 1; }
          test "$NIKKEI_PRIVATE_CLOUD_USE_CONFIRMED" = "true" || { echo "Nikkei private cloud use is not confirmed."; exit 1; }
          test "$JPX_PRIVATE_CLOUD_USE_CONFIRMED" = "true" || { echo "JPX private cloud use is not confirmed."; exit 1; }
          test -n "$PRIVATE_SERVICE_TOKEN" || { echo "PRIVATE_SERVICE_TOKEN is required."; exit 1; }

      - name: Decide whether refresh is required
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIVATE_SITE_URL: ${{ vars.CLOUDFLARE_PRIVATE_SITE_URL }}
          PRIVATE_SERVICE_TOKEN: ${{ secrets.PRIVATE_SERVICE_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: force refresh"
            echo "should_refresh=true" >> "$GITHUB_OUTPUT"
          elif python3 work/check_published_freshness.py \
            --url "$PRIVATE_SITE_URL/data/latest-candidates.json" \
            --analysis-url "$PRIVATE_SITE_URL/data/nikkei225-analysis.json" \
            --history-url "$PRIVATE_SITE_URL/data/score-history-v2.json"; then
            echo "Private site data is already fresh; skip backup refresh"
            echo "should_refresh=false" >> "$GITHUB_OUTPUT"
          else
            echo "Private site data is stale or unavailable; run refresh"
            echo "should_refresh=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: freshness
    if: needs.freshness.outputs.should_refresh == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Refresh market environment
        run: python work/market_environment.py

      - name: Refresh market data and persistent histories
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          EDINET_MAX_DOWNLOADS: "225"
          TOPIX_PRICE_WORKERS: "8"
          SCORE_HISTORY_URL: ${{ vars.PRIVATE_HISTORY_SOURCE_URL }}/data/score-history-v2.json
          SCORE_HISTORY_REQUIRE_REMOTE: "true"
          WEEKLY_PREDICTIONS_URL: ${{ vars.PRIVATE_HISTORY_SOURCE_URL }}/data/weekly-predictions-v1.json
          WEEKLY_PREDICTIONS_REQUIRE_REMOTE: "true"
          PRIVATE_SERVICE_TOKEN: ${{ secrets.PRIVATE_SERVICE_TOKEN }}
        run: python work/fetch_official_data.py

      - name: Generate public-safe analysis for leak comparison
        run: python work/market_analysis.py

      - name: Validate generated stock data
        run: python work/validate_output.py

      - name: Generate confirmation-gated private analysis
        env:
          NIKKEI_PRIVATE_CLOUD_USE_CONFIRMED: ${{ vars.NIKKEI_PRIVATE_CLOUD_USE_CONFIRMED }}
          JPX_PRIVATE_CLOUD_USE_CONFIRMED: ${{ vars.JPX_PRIVATE_CLOUD_USE_CONFIRMED }}
        run: python work/market_analysis.py --private-cloud

      - name: Prepare and validate private deployment folder
        run: |
          python work/prepare_cloudflare_private.py
          python work/validate_cloudflare_private.py
          node --check .private-deploy/functions/_middleware.js

      - name: Deploy authenticated site to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .private-deploy
          command: pages deploy . --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
