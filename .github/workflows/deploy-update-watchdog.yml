name: Deploy independent update watchdog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate configuration and Worker tests
        run: |
          node --check cloudflare/update-watchdog/worker.mjs
          node --test tests/update_watchdog.mjs

      - name: Write the secret to a temporary runner file
        env:
          WATCHDOG_GITHUB_TOKEN: ${{ secrets.WATCHDOG_GITHUB_TOKEN }}
        run: |
          test -n "$WATCHDOG_GITHUB_TOKEN" || { echo "WATCHDOG_GITHUB_TOKEN is required."; exit 1; }
          node -e 'const fs = require("node:fs"); fs.writeFileSync(process.env.RUNNER_TEMP + "/watchdog-secrets.json", JSON.stringify({ GITHUB_DISPATCH_TOKEN: process.env.WATCHDOG_GITHUB_TOKEN }), { mode: 0o600 });'

      - name: Deploy Worker and secret together
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token is required."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID is required."; exit 1; }
          npx --yes wrangler@4.151.0 deploy \
            --config cloudflare/update-watchdog/wrangler.jsonc \
            --secrets-file "$RUNNER_TEMP/watchdog-secrets.json"

      - name: Remove temporary secret file
        if: always()
        run: rm -f "$RUNNER_TEMP/watchdog-secrets.json"
